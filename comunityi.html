<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nameBy.nori-pixl 動画アップローダー</title>
  <script src="https://nori-pixl.github.io/expansiontag/tag.js"></script>
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 20px auto; padding: 0 16px; }
  label { display: block; margin: 8px 0 2px; font-size: 0.9rem; }
  input[type="text"], textarea { width: 100%; box-sizing: border-box; }
  .error-msg { color: red; display: none; margin-top: 8px; }

  /* comments-widget.js が生成するコメントツリー用の見た目 */
  .cw-comment { border-bottom: 1px solid #eee; padding: 8px 0; }
  .cw-comment-user { font-weight: bold; }
  .cw-comment-meta { font-size: 0.75rem; color: #666; }
  .cw-reaction-row { margin-top: 4px; }
  .cw-reaction-btn {
    font-size: 0.85rem; margin-right: 4px; padding: 2px 8px;
    border: 1px solid #ccc; border-radius: 12px; background: #fff; cursor: pointer;
  }
  .cw-reaction-btn:hover { background: #f0f0f0; }
  .cw-reaction-btn.cw-active { background: #cce5ff; border-color: #66a3ff; }
  .cw-reply-toggle {
    font-size: 0.8rem; margin-top: 4px; background: none; border: none; color: #06c; cursor: pointer; padding: 0;
  }
  .cw-reply-form { margin: 6px 0 6px 12px; padding: 6px; border-left: 2px solid #ddd; }
  .cw-replies { margin-top: 4px; }
</style>
</head>
<body>
  <h1>nameBy.nori-pixl My Videoアップローダー<br>render版</h1>
  <p>cloudflaredからrenderで受け取るので、不安定な場合もあり、待ち時間が発生し、遅延があるバージョンです。</p>
  <p>v1.8 匿名動画アップローダー</p><br>
  <a href="index.html" style="font-size:30px;">戻る</a>

  <h2>コミュニティコメント</h2>
  <p style="font-size:0.85rem;color:#666;">動画に関係なく、誰でも匿名で書き込める掲示板です。</p>
  <div id="community-comment-form-area">
    <label style="font-size:0.85rem;">名前(任意、空なら「名無し」)</label>
    <input type="text" id="community-comment-name">
    <label style="font-size:0.85rem;">コメント</label>
    <textarea id="community-comment-input" rows="2" placeholder="コメントを入力"></textarea>
    <button id="community-comment-submit">コメントする</button>
    <div class="error-msg" id="community-comment-error"></div>
  </div>
  <div id="community-comment-list">読み込み中...</div>

  <h6>&copy nori-pixl</h6>
  <script src="/config.js"></script>
  <script src="/comments-widget.js"></script>
  <script>
    const listEl = document.getElementById("community-comment-list");
    const fetchOptions = {
      fetchUrl: BACKEND_URL + "/community/comments",
      postUrl: BACKEND_URL + "/community/comments",
      reactUrlBuilder: (id) => BACKEND_URL + "/community/comments/" + id + "/react",
    };

    cwSetupTopLevelForm({
      nameInputId: "community-comment-name",
      contentInputId: "community-comment-input",
      submitBtnId: "community-comment-submit",
      errorId: "community-comment-error",
      postUrl: fetchOptions.postUrl,
      containerEl: listEl,
      fetchOptions,
    });

    cwLoadComments(listEl, fetchOptions);
  </script>
</body>
</html>
