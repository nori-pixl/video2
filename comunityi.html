<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nameBy.nori-pixl 動画アップローダー</title>
  <script src="https://nori-pixl.github.io/expansiontag/tag.js"></script>
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 20px auto; padding: 0 16px; }
  label { display: block; margin: 8px 0 2px; font-size: 0.9rem; }
  input[type="text"], textarea { width: 100%; }
  .error-msg { color: red; display: none; margin-top: 8px; }
  .comment { border-bottom: 1px solid #eee; padding: 8px 0; }
  .comment-user { font-weight: bold; }
  .comment-meta { font-size: 0.75rem; color: #666; }
</style>
</head>
<body>
  <h1>nameBy.nori-pixl My Videoアップローダー<br>render版</h1>
  <p>cloudflaredからrenderで受け取るので、不安定な場合もあり、待ち時間が発生し、遅延があるバージョンです。</p>
  <p>v1.8 匿名動画アップローダー</p><br>
  <a href="index.html" style="font-size:30px;">戻る</a>

  <h2>コミュニティコメント</h2>
  <p style="font-size:0.85rem;color:#666;">動画に関係なく、誰でも匿名で書き込める掲示板です。</p>
  <div id="community-comment-form-area">
    <label style="font-size:0.85rem;">名前(任意、空なら「名無し」)</label>
    <input type="text" id="community-comment-name">
    <label style="font-size:0.85rem;">コメント</label>
    <textarea id="community-comment-input" rows="2" placeholder="コメントを入力"></textarea>
    <button id="community-comment-submit">コメントする</button>
    <div class="error-msg" id="community-comment-error"></div>
  </div>
  <div id="community-comment-list">読み込み中...</div>

  <h6>&copy nori-pixl</h6>
  <script src="/config.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ---- コミュニティコメント(動画に紐付かない匿名掲示板) ----
    const communityNameInput = document.getElementById('community-comment-name');
    communityNameInput.value = localStorage.getItem('displayName') || '';

    async function loadCommunityComments() {
      const listEl = document.getElementById('community-comment-list');
      try {
        const res = await fetch(BACKEND_URL + '/community/comments');

        if (!res.ok) {
          const text = await res.text().catch(() => '');
          listEl.innerHTML = `<p>コメントの読み込みに失敗しました (status: ${res.status})</p><pre style="white-space:pre-wrap;font-size:0.75rem;color:#900;">${escapeHtml(text.slice(0, 500))}</pre>`;
          return;
        }

        const comments = await res.json();

        if (comments.length === 0) {
          listEl.innerHTML = '<p>まだコメントがありません。</p>';
          return;
        }

        listEl.innerHTML = comments.map(c => `
          <div class="comment">
            <div class="comment-user">${escapeHtml(c.username || '名無し')}</div>
            <div>${escapeHtml(c.content)}</div>
            <div class="comment-meta">${escapeHtml(c.created_at)}</div>
          </div>
        `).join('');
      } catch (e) {
        listEl.innerHTML = '<p>通信エラー: ' + escapeHtml(e.message) + '</p>';
      }
    }

    document.getElementById('community-comment-submit').addEventListener('click', submitCommunityComment);

    async function submitCommunityComment() {
      const errorMsg = document.getElementById('community-comment-error');
      errorMsg.style.display = 'none';

      const input = document.getElementById('community-comment-input');
      const content = input.value.trim();
      if (!content) return;

      if (communityNameInput.value.trim()) {
        localStorage.setItem('displayName', communityNameInput.value.trim());
      }

      try {
        const res = await fetch(BACKEND_URL + '/community/comments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content, username: communityNameInput.value.trim() }),
        });

        if (res.ok) {
          input.value = '';
          loadCommunityComments();
        } else {
          const data = await res.json().catch(() => ({}));
          errorMsg.textContent = data.error || 'コメントの投稿に失敗しました';
          errorMsg.style.display = 'block';
        }
      } catch (e) {
        errorMsg.textContent = '通信エラー: ' + e.message;
        errorMsg.style.display = 'block';
      }
    }

    loadCommunityComments();
  </script>
</body>
</html>
