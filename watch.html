<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nameBy.nori-pixl 動画アップローダー</title>
  <script src="https://nori-pixl.github.io/expansiontag/tag.js"></script>
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 20px auto; padding: 0 16px; }
  label { display: block; margin: 8px 0 2px; font-size: 0.9rem; }
  input[type="text"], textarea { width: 100%; box-sizing: border-box; }
  video { width: 100%; background: #000; }
  .error-msg { color: red; display: none; margin-top: 8px; }
  .video-title { font-size: 1.4rem; font-weight: bold; margin: 12px 0 4px; }
  .video-meta { font-size: 0.85rem; color: #666; margin-bottom: 8px; }
  .video-description { white-space: pre-wrap; margin-bottom: 8px; }

  /* 動画本体のリアクション、コメントのリアクションで共有するボタンの見た目 */
  .cw-reaction-btn {
    font-size: 0.9rem; margin-right: 4px; padding: 3px 10px;
    border: 1px solid #ccc; border-radius: 14px; background: #fff; cursor: pointer;
  }
  .cw-reaction-btn:hover { background: #f0f0f0; }
  .cw-reaction-btn.cw-active { background: #cce5ff; border-color: #66a3ff; }
  #video-reactions { margin: 8px 0 16px; }

  /* comments-widget.js が生成するコメントツリー用の見た目 */
  .cw-comment { border-bottom: 1px solid #eee; padding: 8px 0; }
  .cw-comment-user { font-weight: bold; }
  .cw-comment-meta { font-size: 0.75rem; color: #666; }
  .cw-reaction-row { margin-top: 4px; }
  .cw-reply-toggle {
    font-size: 0.8rem; margin-top: 4px; background: none; border: none; color: #06c; cursor: pointer; padding: 0;
  }
  .cw-reply-form { margin: 6px 0 6px 12px; padding: 6px; border-left: 2px solid #ddd; }
  .cw-replies { margin-top: 4px; }
</style>
</head>
<body>
  <a href="index.html">&larr; 一覧に戻る</a>

  <div id="video-area"><p>読み込み中...</p></div>
  <div id="video-reactions"></div>

  <h2>コメント</h2>
  <div id="video-comment-form-area">
    <label style="font-size:0.85rem;">名前(任意、空なら「名無し」)</label>
    <input type="text" id="video-comment-name">
    <label style="font-size:0.85rem;">コメント</label>
    <textarea id="video-comment-input" rows="2" placeholder="コメントを入力"></textarea>
    <button id="video-comment-submit">コメントする</button>
    <div class="error-msg" id="video-comment-error"></div>
  </div>
  <div id="video-comment-list">読み込み中...</div>

  <h6>&copy nori-pixl</h6>
  <script src="/config.js"></script>
  <script src="/comments-widget.js"></script>
  <script>
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str == null ? "" : String(str);
      return div.innerHTML;
    }

    const params = new URLSearchParams(location.search);
    const videoId = params.get("id");
    const videoAreaEl = document.getElementById("video-area");

    if (!videoId) {
      videoAreaEl.innerHTML = "<p>動画IDが指定されていません。</p>";
    } else {
      loadVideo();
    }

    async function loadVideo() {
      try {
        const res = await fetch(BACKEND_URL + "/videos/" + videoId);
        if (!res.ok) {
          const text = await res.text().catch(() => "");
          videoAreaEl.innerHTML = `<p>読み込みに失敗しました (status: ${res.status})</p><pre style="white-space:pre-wrap;font-size:0.75rem;color:#900;">${escapeHtml(text.slice(0, 500))}</pre>`;
          return;
        }
        const video = await res.json();

        videoAreaEl.innerHTML = `
          <video controls preload="metadata" src="${BACKEND_URL}/stream/${video.id}"></video>
          <div class="video-title">${escapeHtml(video.title)}</div>
          <div class="video-meta">投稿者: ${escapeHtml(video.uploader_name || "名無し")} / ${escapeHtml(video.uploaded_at)}</div>
          <div class="video-description">${escapeHtml(video.description || "")}</div>
        `;

        // 動画そのものへのリアクション(グッド/バッド/考えてる顔/不思議な顔/驚いた顔)
        cwRenderVideoReactions(
          document.getElementById("video-reactions"),
          video.id,
          video.reactions,
          BACKEND_URL + "/videos/" + video.id + "/react"
        );

        setupVideoComments(video.id);
      } catch (e) {
        videoAreaEl.innerHTML = "<p>通信エラー: " + escapeHtml(e.message) + "</p>";
      }
    }

    function setupVideoComments(videoId) {
      const listEl = document.getElementById("video-comment-list");
      const fetchOptions = {
        fetchUrl: BACKEND_URL + "/videos/" + videoId + "/comments",
        postUrl: BACKEND_URL + "/videos/" + videoId + "/comments",
        reactUrlBuilder: (commentId) =>
          BACKEND_URL + "/videos/" + videoId + "/comments/" + commentId + "/react",
      };

      cwSetupTopLevelForm({
        nameInputId: "video-comment-name",
        contentInputId: "video-comment-input",
        submitBtnId: "video-comment-submit",
        errorId: "video-comment-error",
        postUrl: fetchOptions.postUrl,
        containerEl: listEl,
        fetchOptions,
      });

      cwLoadComments(listEl, fetchOptions);
    }
  </script>
</body>
</html>
